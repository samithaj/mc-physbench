name: hjepa-platform

on:
  pull_request:
    paths:
      - 'hjepa_platform/**'
      - '.github/workflows/hjepa-platform.yml'
  push:
    branches: [main]
    paths:
      - 'hjepa_platform/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hjepa_platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e ".[test]"
      - name: Fetch upstream H-JEPA configs (YAML only, for config-generation tests)
        run: |
          git init /tmp/H-JEPA
          git -C /tmp/H-JEPA remote add origin https://github.com/kevinghst/H-JEPA.git
          git -C /tmp/H-JEPA fetch --depth 1 origin 97054ecaff83e13839195ec4b92d74c08a0127c5
          git -C /tmp/H-JEPA checkout FETCH_HEAD
      - name: Test
        env:
          HJEPA_SRC: /tmp/H-JEPA
        run: python -m pytest -q
