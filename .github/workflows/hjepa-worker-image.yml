name: hjepa-worker-image

# Builds the RunPod GPU worker image (~10 GB) on demand and pushes it to GHCR.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        default: latest

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space for the CUDA image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: hjepa_platform/worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hjepa-worker:${{ inputs.tag }}
